spring.application.name=fincore-api

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fincore_db}
spring.datasource.username=${DB_USERNAME:fincore}
spring.datasource.password=${DB_PASSWORD:fincore}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Debug Logging
logging.level.root=INFO
logging.level.br.com.fincore=DEBUG
logging.level.org.springframework.web=DEBUG
